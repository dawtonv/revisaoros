<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de Revisões | Português para Orós</title>
<style>:root{--bordo:#012515;--laranja:#D37F28;--teal:#48B993;--bg:#F7F5EC;--ink:#222;--mut:#6b6b6b;--ok:#13694C;--okbg:#E3F5EE;--no:#B3261E;--nobg:#FCE8E6;--line:#DDD5C8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,'Segoe UI',system-ui,sans-serif;font-size:18px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
header{border-bottom:4px solid var(--laranja);padding-bottom:10px;margin-bottom:18px}
header small{color:var(--laranja);font-weight:700;letter-spacing:.06em;font-size:13px}
h1{margin:4px 0 2px;font-size:26px;color:var(--bordo)}header p{margin:0;color:var(--mut);font-size:15px}
.bar{height:8px;background:#E8E0D2;border-radius:6px;overflow:hidden;margin:14px 0 6px}.bar i{display:block;height:100%;background:var(--laranja);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
a.card{display:block;color:inherit;text-decoration:none}a.card:hover{border-color:var(--bordo)}
.card h2{margin:0 0 4px;font-size:20px;color:var(--bordo)}.card p{margin:0;color:var(--mut);font-size:15px}
.txt{background:#FFFDF8;border-left:5px solid var(--laranja)}.txt h3{margin:0 0 8px;font-size:16px}.txt p{margin:0 0 8px;text-align:justify;font-size:17px;color:var(--ink)}.txt em{color:var(--mut);font-size:13px}
.q{font-weight:700;margin:0 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--bordo)}.opt b{min-width:22px;color:var(--laranja)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--nobg);border-color:var(--no)}.opt[disabled]{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin-top:6px;font-size:16px}.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.fb strong{display:block;margin-bottom:4px}.rev{color:var(--bordo);font-weight:700;margin-top:6px;font-size:15px}
.btn{background:var(--laranja);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;margin-top:12px;text-decoration:none;display:inline-block}
.btn.alt{background:#fff;color:var(--bordo);border:2px solid var(--bordo)}
.score{font-size:56px;font-weight:800;color:var(--bordo);line-height:1}.tier{font-size:19px;margin:8px 0 0}
li{margin-bottom:8px}.hide{display:none}
</style></head>
<body><div class="wrap">
<header><small>APROVA+ ALECE</small><h1 id="titulo">Portal de Revisões</h1><p id="desc">Português, concurso da Prefeitura de Orós (CE). Rodadas iniciais das aulas ao vivo.</p></header>
<div id="lista"></div>
<div id="start" class="card hide"><p style="margin-top:0;color:var(--ink)">Responda, veja a explicação na hora e, no fim, descubra qual aula rever. Anote seu placar.</p><button class="btn" onclick="begin()">Começar</button> <a class="btn alt" href="#">Todas as rodadas</a></div>
<div id="quiz" class="hide"><div class="bar"><i id="pb"></i></div><div class="meta"><span id="pos"></span><span id="sc"></span></div>
<div id="txt" class="card txt hide"></div>
<div class="card"><p class="q" id="qq"></p><div id="opts"></div><div id="fb"></div></div>
<button class="btn hide" id="next" onclick="next()">Próxima</button></div>
<div id="end" class="hide"><div class="card"><div class="score" id="fs"></div><p class="tier" id="tier"></p></div>
<div class="card"><h3 style="margin-top:0;color:var(--bordo)">O que rever</h3><div id="rv"></div></div>
<button class="btn" onclick="begin()">Refazer</button> <a class="btn alt" href="#">Todas as rodadas</a></div>
</div>
<script>
/* DADOS: para acrescentar rodadas, peça o arquivo atualizado ou edite estas três listas. */
var RODADAS=[{"id": "dia-06", "titulo": "Dia 6 - 21/11", "descricao": "Revisão dos Dias 1, 2 e 5 (interpretação, coesão, gêneros, semântica, funções da linguagem, fonologia, ortografia e acentuação).", "data": "2026-11-21", "questoes": ["q001", "q002", "q003", "q004", "q005", "q006", "q007", "q008", "q009", "q010", "q011", "q012", "q013", "q014", "q015"]}];
var QUESTOES=[{"id": "q001", "texto": "agua-oros", "enunciado": "A ideia central do texto é:", "alternativas": ["o açude de Orós oferece riscos à população em cheias", "a seca fez a cidade desistir de comemorar sempre", "o açude é motivo de orgulho, e a água merece cuidado", "as crianças devem proteger sozinhas os reservatórios"], "gabarito": 2, "explicacao": "O texto mostra o orgulho da cidade com o açude, lembra o tempo de seca e conclui que a água, por ser preciosa, merece cuidado. As demais alternativas extrapolam ou contradizem o texto (riscos em cheias, desistência de comemorar, responsabilidade exclusiva das crianças).", "origem": {"aula": "Dia 1 - Aula 1", "tema": "compreensão e interpretação"}}, {"id": "q002", "texto": "agua-oros", "enunciado": "O trecho \"Hoje, com o reservatório cheio\" pressupõe que:", "alternativas": ["houve época em que ele não estava cheio", "o reservatório foi construído recentemente", "a cidade está em festa permanente hoje", "a seca nunca atingiu a região"], "gabarito": 0, "explicacao": "O advérbio \"hoje\" marca contraste com o passado e pressupõe que antes a situação era outra, e o texto confirma ao falar dos anos de seca. As demais alternativas não decorrem do trecho; D contradiz o texto.", "origem": {"aula": "Dia 1 - Aula 2", "tema": "inferência, pressupostos e subentendidos"}}, {"id": "q003", "texto": "agua-oros", "enunciado": "No trecho \"nesses tempos, o orgulho dava lugar à preocupação\", o termo \"nesses tempos\" retoma:", "alternativas": ["o momento em que as comportas se abrem", "os mais novos, que ouvem as histórias", "as famílias que vão ver a água descer", "os anos de seca"], "gabarito": 3, "explicacao": "\"Nesses tempos\" é coesão referencial por anáfora: o demonstrativo \"esses\" retoma \"os anos de seca\", citados na frase imediatamente anterior.", "origem": {"aula": "Dia 1 - Aula 2", "tema": "coesão referencial"}}, {"id": "q004", "texto": "agua-oros", "enunciado": "Em \"Mas há quem lembre os anos de seca\", a conjunção \"mas\" introduz ideia de:", "alternativas": ["soma de uma ideia semelhante à anterior", "oposição à ideia de orgulho tranquilo", "explicação do motivo do orgulho", "conclusão do que foi dito antes"], "gabarito": 1, "explicacao": "\"Mas\" é conectivo de oposição (coesão sequencial): contrapõe a lembrança da seca ao orgulho com que o parágrafo começou.", "origem": {"aula": "Dia 1 - Aula 2", "tema": "coesão sequencial e conectivos"}}, {"id": "q005", "texto": "agua-oros", "enunciado": "Em \"a cidade respira aliviada\", o verbo \"respirar\" está empregado em sentido:", "alternativas": ["conotativo, pois atribui à cidade um traço humano", "denotativo, pois descreve um processo biológico real", "denotativo, pois a cidade possui pulmões", "técnico, pois pertence ao vocabulário da medicina"], "gabarito": 0, "explicacao": "Uma cidade não respira de fato: o verbo foi usado em sentido figurado (conotação), personificando a cidade. Em sentido denotativo (literal), respirar é trocar gases com o ambiente.", "origem": {"aula": "Dia 2 - Aula 3", "tema": "denotação e conotação"}}, {"id": "q006", "texto": null, "enunciado": "Assinale a alternativa em que o gênero textual corresponde ao tipo predominante indicado:", "alternativas": ["receita culinária de bolo: tipo narrativo", "notícia de jornal impresso: tipo injuntivo", "manual de instruções: tipo injuntivo", "ata de reunião: tipo dissertativo-argumentativo"], "gabarito": 2, "explicacao": "O tipo injuntivo (instrucional) orienta ações por meio de verbos no imperativo ou no infinitivo, como no manual de instruções. A receita culinária também é injuntiva, e não narrativa. A notícia é predominantemente expositiva, e a ata registra fatos de modo expositivo.", "origem": {"aula": "Dia 2 - Aula 1", "tema": "tipologia textual"}}, {"id": "q007", "texto": null, "enunciado": "Assinale a alternativa que contém apenas gêneros textuais oficiais ou administrativos:", "alternativas": ["crônica, ofício, ata", "ofício, requerimento, ata", "requerimento, soneto, memorando", "memorando, editorial, ofício"], "gabarito": 1, "explicacao": "Ofício, requerimento e ata são gêneros de comunicação oficial ou administrativa. Crônica (A), soneto (C) e editorial (D) pertencem a outros domínios (literário e jornalístico).", "origem": {"aula": "Dia 2 - Aula 2", "tema": "gêneros textuais"}}, {"id": "q008", "texto": null, "enunciado": "Assinale a alternativa em que os termos são antônimos:", "alternativas": ["efêmero e passageiro", "cauteloso e prudente", "ínfimo e minúsculo", "loquaz e taciturno"], "gabarito": 3, "explicacao": "Loquaz é quem fala muito; taciturno é quem fala pouco ou é calado: sentidos opostos. Nos demais pares, os termos são sinônimos.", "origem": {"aula": "Dia 2 - Aula 3", "tema": "sinônimos e antônimos"}}, {"id": "q009", "texto": null, "enunciado": "Assinale a alternativa em que os parônimos estão empregados corretamente:", "alternativas": ["O juiz infligiu a pena máxima ao réu.", "A empresa descriminou candidatos por preconceito racial.", "O fiscal retificou a prova, confirmando a assinatura.", "Todos temiam o eminente desabamento do prédio antigo."], "gabarito": 0, "explicacao": "\"Infligir\" é aplicar pena ou castigo; \"infringir\" é violar. Em B, o correto seria \"discriminou\" (descriminar é inocentar). Em C, \"ratificou\" (confirmar); \"retificar\" é corrigir. Em D, \"iminente\" (prestes a acontecer); \"eminente\" é elevado, notável.", "origem": {"aula": "Dia 2 - Aula 4", "tema": "parônimos"}}, {"id": "q010", "texto": null, "enunciado": "Em qual alternativa o par de palavras é de homônimos homófonos (mesma pronúncia, grafia diferente)?", "alternativas": ["manga (fruta) e manga (da camisa)", "espiar e expiar", "concerto e conserto", "infringir e infligir"], "gabarito": 2, "explicacao": "\"Concerto\" (apresentação musical) e \"conserto\" (reparo) soam igual e se escrevem diferente. Em A, a grafia é a mesma (homonímia perfeita). Em B e D, as palavras são parônimas, pois têm pronúncia parecida, mas não igual.", "origem": {"aula": "Dia 2 - Aula 4", "tema": "homônimos e parônimos"}}, {"id": "q011", "texto": null, "enunciado": "No enunciado publicitário \"Compre agora e economize!\", predomina a função da linguagem:", "alternativas": ["emotiva", "conativa", "poética", "referencial"], "gabarito": 1, "explicacao": "A função conativa (ou apelativa) busca convencer ou levar o receptor a agir, e costuma usar verbos no imperativo, como \"compre\" e \"economize\". A emotiva centra-se em quem fala; a poética, na forma da mensagem; a referencial, em informar sobre um assunto.", "origem": {"aula": "Dia 5 - Aula 1", "tema": "funções da linguagem"}}, {"id": "q012", "texto": null, "enunciado": "Em um ofício dirigido ao Prefeito, a frase mais adequada à situação comunicativa é:", "alternativas": ["Prefeito, a gente tá precisando de uma força aí pra resolver logo.", "Senhor Prefeito, bora resolver isso logo, porque tá complicado demais?", "Ei, chefe, manda um carro pra gente lá na comunidade, tá bom?", "Solicito a Vossa Excelência as providências cabíveis."], "gabarito": 3, "explicacao": "Em comunicação oficial, exigem-se a variedade formal, o pronome de tratamento adequado (\"Vossa Excelência\") e o verbo na 3ª pessoa. As demais frases usam marcas de oralidade e informalidade (a gente, tá, bora, chefe), inadequadas ao gênero.", "origem": {"aula": "Dia 5 - Aula 1", "tema": "variedade linguística e adequação"}}, {"id": "q013", "texto": null, "enunciado": "Assinale a alternativa em que a palavra está com a separação silábica correta:", "alternativas": ["su-bli-nhar", "ps-i-co-lo-gi-a", "ad-mi-ra-ção", "a-bs-o-lu-to"], "gabarito": 2, "explicacao": "Em \"ad-mi-ra-ção\", o \"d\" fecha a primeira sílaba (encontro consonantal separável) e \"ção\" forma uma só sílaba. Corretas das demais: sub-li-nhar, psi-co-lo-gi-a, ab-so-lu-to.", "origem": {"aula": "Dia 5 - Aula 2", "tema": "fonologia e divisão silábica"}}, {"id": "q014", "texto": null, "enunciado": "Assinale a alternativa em que todas as palavras estão grafadas corretamente:", "alternativas": ["exceção, obsessão, chuchu", "excessão, obsessão, chuchu", "exceção, obseção, chuchu", "exceção, obsessão, enxente"], "gabarito": 0, "explicacao": "Exceção (de excetuar, grafa-se com \"xc\" e \"ç\"), obsessão (com \"ss\") e chuchu (com \"ch\") estão corretas. Em B, \"excessão\" erra; em C, \"obseção\" erra; em D, o correto é \"enchente\".", "origem": {"aula": "Dia 5 - Aula 3", "tema": "ortografia"}}, {"id": "q015", "texto": null, "enunciado": "Assinale a alternativa em que todas as palavras estão acentuadas de acordo com o Acordo Ortográfico de 2009:", "alternativas": ["idéia, herói, jiboia", "ideia, herói, jiboia", "ideia, heroi, jiboia", "idéia, heroi, jibóia"], "gabarito": 1, "explicacao": "Com o Acordo, os ditongos abertos \"ei\" e \"oi\" perdem o acento em palavras paroxítonas (ideia, jiboia), mas \"herói\" mantém o acento porque é oxítona. Por isso, \"idéia\" e \"jibóia\" não são mais acentuadas, e \"heroi\" está sem o acento obrigatório.", "origem": {"aula": "Dia 5 - Aula 4", "tema": "acentuação gráfica"}}];
var TEXTOS={"agua-oros": {"titulo": "Texto de revisão: A água de Orós", "fonte": "Texto didático original.", "paragrafos": ["Em Orós, o açude é motivo de orgulho. Quando as comportas se abrem, famílias inteiras vão ver a água descer, e as crianças, que nunca esquecem a cena, contam o que viram aos mais novos. Mas há quem lembre os anos de seca: nesses tempos, o orgulho dava lugar à preocupação, e ninguém falava em festa.", "Hoje, com o reservatório cheio, a cidade respira aliviada, embora saiba que a água, como tudo que é precioso, merece cuidado."]}};
var Q=[],R=null,i=0,score=0,wrong=[],done=false;
function $(id){return document.getElementById(id)}
function route(){
  var id=decodeURIComponent(location.hash.replace('#',''));
  R=RODADAS.filter(function(x){return x.id===id})[0];
  ['start','quiz','end'].forEach(function(k){$(k).className='hide'});
  if(!R){lista();return}
  var by={};QUESTOES.forEach(function(x){by[x.id]=x});Q=R.questoes.map(function(k){return by[k]});
  $('lista').className='hide';$('titulo').textContent=R.titulo;$('desc').textContent=R.descricao;document.title=R.titulo+' | Português para Orós';$('start').className='card';
}
function lista(){
  $('titulo').textContent='Portal de Revisões';$('desc').textContent='Português, concurso da Prefeitura de Orós (CE). Rodadas iniciais das aulas ao vivo.';document.title='Portal de Revisões | Português para Orós';
  var l=$('lista');l.className='';l.innerHTML='';
  RODADAS.slice().reverse().forEach(function(r){var a=document.createElement('a');a.className='card';a.href='#'+encodeURIComponent(r.id);
    var h=document.createElement('h2');h.textContent=r.titulo;var p=document.createElement('p');p.textContent=r.descricao+' ('+r.questoes.length+' questões)';a.appendChild(h);a.appendChild(p);l.appendChild(a)});
}
window.addEventListener('hashchange',route);route();
function begin(){i=0;score=0;wrong=[];$('start').className='hide';$('end').className='hide';$('quiz').className='';show()}
function show(){done=false;var q=Q[i];$('pos').textContent='Questão '+(i+1)+' de '+Q.length;$('sc').textContent='Acertos: '+score;
$('pb').style.width=(i/Q.length*100)+'%';$('qq').textContent=q.enunciado;$('fb').innerHTML='';$('next').className='btn hide';
var t=$('txt');t.innerHTML='';if(q.texto&&TEXTOS[q.texto]){var x=TEXTOS[q.texto];t.className='card txt';var h=document.createElement('h3');h.textContent=x.titulo;t.appendChild(h);
x.paragrafos.forEach(function(p){var e=document.createElement('p');e.textContent=p;t.appendChild(e)});var em=document.createElement('em');em.textContent=x.fonte;t.appendChild(em)}else{t.className='card txt hide'}
var o=$('opts');o.innerHTML='';q.alternativas.forEach(function(a,k){var b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+'ABCD'[k]+'</b><span></span>';b.lastChild.textContent=a;b.onclick=function(){pick(k)};o.appendChild(b)});window.scrollTo(0,0)}
function pick(k){if(done)return;done=true;var q=Q[i],bs=$('opts').children;for(var j=0;j<bs.length;j++){bs[j].disabled=true}
bs[q.gabarito].className='opt ok';var hit=k===q.gabarito;if(hit){score++}else{bs[k].className='opt no';wrong.push(q)}
var f=$('fb');f.className='fb '+(hit?'ok':'no');f.innerHTML='<strong>'+(hit?'Correto!':'Não foi dessa vez. Gabarito: '+'ABCD'[q.gabarito])+'</strong><span></span><div class="rev"></div>';
f.children[1].textContent=q.explicacao;f.children[2].textContent='Revisar: '+q.origem.aula+' ('+q.origem.tema+')';$('sc').textContent='Acertos: '+score;
$('next').textContent=i===Q.length-1?'Ver resultado':'Próxima';$('next').className='btn'}
function next(){if(i===Q.length-1){finish()}else{i++;show()}}
function finish(){$('quiz').className='hide';$('end').className='';var n=Q.length;$('fs').textContent=score+' / '+n;
var p=score/n;$('tier').textContent=p>=.85?'Ótimo! Siga com confiança para a aula.':p>=.6?'Bom! Revise os pontos errados indicados abaixo.':'Vale rever as aulas gravadas indicadas abaixo antes da próxima aula ao vivo.';
var r=$('rv');r.innerHTML='';if(!wrong.length){r.textContent='Você acertou tudo. Nada a rever!';return}
var g={};wrong.forEach(function(q){var k=q.origem.aula+' ('+q.origem.tema+')';(g[k]=g[k]||[]).push(q.id)});
var ul=document.createElement('ul');Object.keys(g).forEach(function(k){var li=document.createElement('li');li.textContent=k+': '+g[k].length+(g[k].length>1?' erros':' erro');ul.appendChild(li)});r.appendChild(ul)}
</script></body></html>
