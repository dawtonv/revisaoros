<header><small>APROVA+ ALECE</small><h1 id="titulo">Portal de Revisões</h1><p id="desc">Português, concurso da Prefeitura de Orós (CE). Rodadas iniciais das aulas ao vivo.</p></header>
<div id="lista"></div>
<div id="start" class="card hide"><p style="margin-top:0;color:var(--ink)">Responda, veja a explicação na hora e, no fim, descubra qual aula rever. Anote seu placar.</p><button class="btn" onclick="begin()">Começar</button> <a class="btn alt" href="#">Todas as rodadas</a></div>

<script>
/* DADOS: para acrescentar rodadas, peça o arquivo atualizado ou edite estas três listas. */
var RODADAS=[{"id": "dia-06", "titulo": "Dia 6 - 21/11", "descricao": "Revisão dos Dias 1, 2 e 5 (interpretação, coesão, gêneros, semântica, funções da linguagem, fonologia, ortografia e acentuação).", "data": "2026-11-21", "questoes": ["q001", "q002", "q003", "q004", "q005", "q006", "q007", "q008", "q009", "q010", "q011", "q012", "q013", "q014", "q015"]}, {"id": "dia-12", "titulo": "Dia 12 - 28/11", "descricao": "Revisão dos Dias 8 e 10: formação de palavras, reescrita, crase, pontuação, sintaxe e vozes verbais.", "data": "2026-11-28", "questoes": ["q016", "q017", "q018", "q019", "q020", "q021", "q022", "q023", "q024", "q025", "q026", "q027", "q028", "q029", "q030"]}, {"id": "dia-14", "titulo": "Dia 14 - 01/12", "descricao": "Revisão dos Dias 12 e 14: figuras de linguagem, concordância e regência.", "data": "2026-12-01", "questoes": ["q031", "q032", "q033", "q034", "q035", "q036", "q037", "q038", "q039", "q040", "q041", "q042", "q043", "q044", "q045"]}, {"id": "simulado-geral", "titulo": "Simulado Geral", "descricao": "Questões de nível mais alto sobre todo o conteúdo do curso, de interpretação a regência.", "data": "2026-12-01", "questoes": ["q046", "q047", "q048", "q049", "q050", "q051", "q052", "q053", "q054", "q055", "q056", "q057", "q058", "q059", "q060", "q061", "q062", "q063", "q064", "q065", "q066", "q067", "q068", "q069"]}];
var QUESTOES=[{"id": "q001", "texto": "agua-oros", "enunciado": "A ideia central do texto é:", "alternativas": ["o açude de Orós oferece riscos à população em cheias", "a seca fez a cidade desistir de comemorar sempre", "o açude é motivo de orgulho, e a água merece cuidado", "as crianças devem proteger sozinhas os reservatórios"], "gabarito": 2, "explicacao": "O texto mostra o orgulho da cidade com o açude, lembra o tempo de seca e conclui que a água, por ser preciosa, merece cuidado. As demais alternativas extrapolam ou contradizem o texto (riscos em cheias, desistência de comemorar, responsabilidade exclusiva das crianças).", "origem": {"aula": "Dia 1 - Aula 1", "tema": "compreensão e interpretação"}}, {"id": "q002", "texto": "agua-oros", "enunciado": "O trecho \"Hoje, com o reservatório cheio\" pressupõe que:", "alternativas": ["houve época em que ele não estava cheio", "o reservatório foi construído recentemente", "a cidade está em festa permanente hoje", "a seca nunca atingiu a região"], "gabarito": 0, "explicacao": "O advérbio \"hoje\" marca contraste com o passado e pressupõe que antes a situação era outra, e o texto confirma ao falar dos anos de seca. As demais alternativas não decorrem do trecho; D contradiz o texto.", "origem": {"aula": "Dia 1 - Aula 2", "tema": "inferência, pressupostos e subentendidos"}}, {"id": "q003", "texto": "agua-oros", "enunciado": "No trecho \"nesses tempos, o orgulho dava lugar à preocupação\", o termo \"nesses tempos\" retoma:", "alternativas": ["o momento em que as comportas se abrem", "os mais novos, que ouvem as histórias", "as famílias que vão ver a água descer", "os anos de seca"], "gabarito": 3, "explicacao": "\"Nesses tempos\" é coesão referencial por anáfora: o demonstrativo \"esses\" retoma \"os anos de seca\", citados na frase imediatamente anterior.", "origem": {"aula": "Dia 1 - Aula 2", "tema": "coesão referencial"}}, {"id": "q004", "texto": "agua-oros", "enunciado": "Em \"Mas há quem lembre os anos de seca\", a conjunção \"mas\" introduz ideia de:", "alternativas": ["soma de uma ideia semelhante à anterior", "oposição à ideia de orgulho tranquilo", "explicação do motivo do orgulho", "conclusão do que foi dito antes"], "gabarito": 1, "explicacao": "\"Mas\" é conectivo de oposição (coesão sequencial): contrapõe a lembrança da seca ao orgulho com que o parágrafo começou.", "origem": {"aula": "Dia 1 - Aula 2", "tema": "coesão sequencial e conectivos"}}, {"id": "q005", "texto": "agua-oros", "enunciado": "Em \"a cidade respira aliviada\", o verbo \"respirar\" está empregado em sentido:", "alternativas": ["conotativo, pois atribui à cidade um traço humano", "denotativo, pois descreve um processo biológico real", "denotativo, pois a cidade possui pulmões", "técnico, pois pertence ao vocabulário da medicina"], "gabarito": 0, "explicacao": "Uma cidade não respira de fato: o verbo foi usado em sentido figurado (conotação), personificando a cidade. Em sentido denotativo (literal), respirar é trocar gases com o ambiente.", "origem": {"aula": "Dia 2 - Aula 3", "tema": "denotação e conotação"}}, {"id": "q006", "texto": null, "enunciado": "Assinale a alternativa em que o gênero textual corresponde ao tipo predominante indicado:", "alternativas": ["receita culinária de bolo: tipo narrativo", "notícia de jornal impresso: tipo injuntivo", "manual de instruções: tipo injuntivo", "ata de reunião: tipo dissertativo-argumentativo"], "gabarito": 2, "explicacao": "O tipo injuntivo (instrucional) orienta ações por meio de verbos no imperativo ou no infinitivo, como no manual de instruções. A receita culinária também é injuntiva, e não narrativa. A notícia é predominantemente expositiva, e a ata registra fatos de modo expositivo.", "origem": {"aula": "Dia 2 - Aula 1", "tema": "tipologia textual"}}, {"id": "q007", "texto": null, "enunciado": "Assinale a alternativa que contém apenas gêneros textuais oficiais ou administrativos:", "alternativas": ["crônica, ofício, ata", "ofício, requerimento, ata", "requerimento, soneto, memorando", "memorando, editorial, ofício"], "gabarito": 1, "explicacao": "Ofício, requerimento e ata são gêneros de comunicação oficial ou administrativa. Crônica (A), soneto (C) e editorial (D) pertencem a outros domínios (literário e jornalístico).", "origem": {"aula": "Dia 2 - Aula 2", "tema": "gêneros textuais"}}, {"id": "q008", "texto": null, "enunciado": "Assinale a alternativa em que os termos são antônimos:", "alternativas": ["efêmero e passageiro", "cauteloso e prudente", "ínfimo e minúsculo", "loquaz e taciturno"], "gabarito": 3, "explicacao": "Loquaz é quem fala muito; taciturno é quem fala pouco ou é calado: sentidos opostos. Nos demais pares, os termos são sinônimos.", "origem": {"aula": "Dia 2 - Aula 3", "tema": "sinônimos e antônimos"}}, {"id": "q009", "texto": null, "enunciado": "Assinale a alternativa em que os parônimos estão empregados corretamente:", "alternativas": ["O juiz infligiu a pena máxima ao réu.", "A empresa descriminou candidatos por preconceito racial.", "O fiscal retificou a prova, confirmando a assinatura.", "Todos temiam o eminente desabamento do prédio antigo."], "gabarito": 0, "explicacao": "\"Infligir\" é aplicar pena ou castigo; \"infringir\" é violar. Em B, o correto seria \"discriminou\" (descriminar é inocentar). Em C, \"ratificou\" (confirmar); \"retificar\" é corrigir. Em D, \"iminente\" (prestes a acontecer); \"eminente\" é elevado, notável.", "origem": {"aula": "Dia 2 - Aula 4", "tema": "parônimos"}}, {"id": "q010", "texto": null, "enunciado": "Em qual alternativa o par de palavras é de homônimos homófonos (mesma pronúncia, grafia diferente)?", "alternativas": ["manga (fruta) e manga (da camisa)", "espiar e expiar", "concerto e conserto", "infringir e infligir"], "gabarito": 2, "explicacao": "\"Concerto\" (apresentação musical) e \"conserto\" (reparo) soam igual e se escrevem diferente. Em A, a grafia é a mesma (homonímia perfeita). Em B e D, as palavras são parônimas, pois têm pronúncia parecida, mas não igual.", "origem": {"aula": "Dia 2 - Aula 4", "tema": "homônimos e parônimos"}}, {"id": "q011", "texto": null, "enunciado": "No enunciado publicitário \"Compre agora e economize!\", predomina a função da linguagem:", "alternativas": ["emotiva", "conativa", "poética", "referencial"], "gabarito": 1, "explicacao": "A função conativa (ou apelativa) busca convencer ou levar o receptor a agir, e costuma usar verbos no imperativo, como \"compre\" e \"economize\". A emotiva centra-se em quem fala; a poética, na forma da mensagem; a referencial, em informar sobre um assunto.", "origem": {"aula": "Dia 5 - Aula 1", "tema": "funções da linguagem"}}, {"id": "q012", "texto": null, "enunciado": "Em um ofício dirigido ao Prefeito, a frase mais adequada à situação comunicativa é:", "alternativas": ["Prefeito, a gente tá precisando de uma força aí pra resolver logo.", "Senhor Prefeito, bora resolver isso logo, porque tá complicado demais?", "Ei, chefe, manda um carro pra gente lá na comunidade, tá bom?", "Solicito a Vossa Excelência as providências cabíveis."], "gabarito": 3, "explicacao": "Em comunicação oficial, exigem-se a variedade formal, o pronome de tratamento adequado (\"Vossa Excelência\") e o verbo na 3ª pessoa. As demais frases usam marcas de oralidade e informalidade (a gente, tá, bora, chefe), inadequadas ao gênero.", "origem": {"aula": "Dia 5 - Aula 1", "tema": "variedade linguística e adequação"}}, {"id": "q013", "texto": null, "enunciado": "Assinale a alternativa em que a palavra está com a separação silábica correta:", "alternativas": ["su-bli-nhar", "ps-i-co-lo-gi-a", "ad-mi-ra-ção", "a-bs-o-lu-to"], "gabarito": 2, "explicacao": "Em \"ad-mi-ra-ção\", o \"d\" fecha a primeira sílaba (encontro consonantal separável) e \"ção\" forma uma só sílaba. Corretas das demais: sub-li-nhar, psi-co-lo-gi-a, ab-so-lu-to.", "origem": {"aula": "Dia 5 - Aula 2", "tema": "fonologia e divisão silábica"}}, {"id": "q014", "texto": null, "enunciado": "Assinale a alternativa em que todas as palavras estão grafadas corretamente:", "alternativas": ["exceção, obsessão, chuchu", "excessão, obsessão, chuchu", "exceção, obseção, chuchu", "exceção, obsessão, enxente"], "gabarito": 0, "explicacao": "Exceção (de excetuar, grafa-se com \"xc\" e \"ç\"), obsessão (com \"ss\") e chuchu (com \"ch\") estão corretas. Em B, \"excessão\" erra; em C, \"obseção\" erra; em D, o correto é \"enchente\".", "origem": {"aula": "Dia 5 - Aula 3", "tema": "ortografia"}}, {"id": "q015", "texto": null, "enunciado": "Assinale a alternativa em que todas as palavras estão acentuadas de acordo com o Acordo Ortográfico de 2009:", "alternativas": ["idéia, herói, jiboia", "ideia, herói, jiboia", "ideia, heroi, jiboia", "idéia, heroi, jibóia"], "gabarito": 1, "explicacao": "Com o Acordo, os ditongos abertos \"ei\" e \"oi\" perdem o acento em palavras paroxítonas (ideia, jiboia), mas \"herói\" mantém o acento porque é oxítona. Por isso, \"idéia\" e \"jibóia\" não são mais acentuadas, e \"heroi\" está sem o acento obrigatório.", "origem": {"aula": "Dia 5 - Aula 4", "tema": "acentuação gráfica"}}, {"id": "q016", "texto": null, "enunciado": "Em \"infelizmente\", a sequência de elementos mórficos é:", "alternativas": ["prefixo, radical, vogal temática e sufixo", "prefixo, radical, sufixo e sufixo", "radical, sufixo, prefixo e vogal temática", "prefixo, radical e dois prefixos seguidos"], "gabarito": 1, "explicacao": "In- (prefixo de negação) + feliz (radical) + -mente (sufixo formador de advérbio). Na derivação, o prefixo e o sufixo se somam a um radical, o que resulta em in+feliz+mente.", "origem": {"aula": "Dia 8 - Aula 1", "tema": "estrutura das palavras"}}, {"id": "q017", "texto": null, "enunciado": "A palavra \"pontapé\" foi formada por:", "alternativas": ["derivação prefixal, com o prefixo \"ponta\"", "derivação sufixal, com o sufixo \"pé\"", "composição por aglutinação, com perda de fonemas", "composição por justaposição"], "gabarito": 3, "explicacao": "\"Pontapé\" une \"ponta\" e \"pé\" sem perda de fonemas nem alteração, e por isso é justaposição. Na aglutinação, um dos elementos perde sua integridade, como em \"planalto\" (plano + alto).", "origem": {"aula": "Dia 8 - Aula 1", "tema": "formação de palavras: composição"}}, {"id": "q018", "texto": null, "enunciado": "Assinale a alternativa em que a palavra foi formada por derivação regressiva:", "alternativas": ["ajuda", "desleal", "felizmente", "infiel"], "gabarito": 0, "explicacao": "\"Ajuda\" vem do verbo \"ajudar\", com redução do final (derivação regressiva ou deverbal). As demais são derivadas por prefixo (desleal, infiel) ou por sufixo (felizmente).", "origem": {"aula": "Dia 8 - Aula 1", "tema": "formação de palavras: derivação regressiva"}}, {"id": "q019", "texto": null, "enunciado": "Em \"Ela chegou cedo; entretanto, não conseguiu lugar\", o conectivo pode ser substituído, sem alteração de sentido, por:", "alternativas": ["pois", "portanto", "todavia", "porque"], "gabarito": 2, "explicacao": "\"Entretanto\" é adversativo e equivale a \"todavia\", \"contudo\", \"porém\". \"Pois\" e \"porque\" explicam e \"portanto\" conclui.", "origem": {"aula": "Dia 8 - Aula 2", "tema": "reescrita: conectivos"}}, {"id": "q020", "texto": null, "enunciado": "Assinale a reescrita de \"O prefeito inaugurou a ponte\" na voz passiva, sem mudança de sentido:", "alternativas": ["A ponte inaugurou o prefeito.", "A ponte foi inaugurada pelo prefeito.", "O prefeito foi inaugurado pela ponte.", "A ponte inaugurava-se ao prefeito."], "gabarito": 1, "explicacao": "Na passiva analítica, o objeto direto vira sujeito, o verbo passa a \"ser + particípio\" e o antigo sujeito vira agente da passiva: \"A ponte foi inaugurada pelo prefeito\".", "origem": {"aula": "Dia 8 - Aula 2", "tema": "reescrita: voz passiva"}}, {"id": "q021", "texto": null, "enunciado": "Em \"Quando chegou, ele já tinha saído\", a oração destacada pode ser reescrita, sem alterar o sentido, como:", "alternativas": ["Porque chegou, ele já tinha saído.", "Se chegou, ele já tinha saído.", "Embora chegasse, ele já tinha saído.", "Ao chegar, ele já tinha saído."], "gabarito": 3, "explicacao": "\"Quando chegou\" tem valor temporal e se equivale a \"ao chegar\" (oração reduzida de infinitivo). As demais trazem condição, concessão ou causa.", "origem": {"aula": "Dia 8 - Aula 2", "tema": "reescrita: orações reduzidas"}}, {"id": "q022", "texto": null, "enunciado": "Assinale a alternativa em que a reescrita de \"Fiz o trabalho, mas esqueci de entregá-lo\" mantém o sentido:", "alternativas": ["Fiz o trabalho, porém esqueci de entregá-lo.", "Fiz o trabalho, logo esqueci de entregá-lo.", "Fiz o trabalho, pois esqueci de entregá-lo.", "Fiz o trabalho, porque esqueci de entregá-lo."], "gabarito": 0, "explicacao": "\"Mas\" e \"porém\" são adversativas. \"Logo\" conclui, enquanto \"pois\" e \"porque\" dão causa ou explicação, o que altera a relação lógica.", "origem": {"aula": "Dia 8 - Aula 2", "tema": "reescrita: relações lógicas"}}, {"id": "q023", "texto": null, "enunciado": "Assinale a alternativa em que há crase obrigatória:", "alternativas": ["Entreguei o relatório a todos.", "Entreguei o relatório a ela.", "Entreguei o relatório à diretora.", "Entreguei o relatório a Vossa Senhoria."], "gabarito": 2, "explicacao": "A crase ocorre quando a preposição \"a\" se junta ao artigo feminino: \"à diretora\". Antes de pronome pessoal, de pronome indefinido e de Vossa Senhoria, não há artigo.", "origem": {"aula": "Dia 10 - Aula 1", "tema": "crase"}}, {"id": "q024", "texto": null, "enunciado": "Assinale a alternativa em que o acento grave está empregado corretamente:", "alternativas": ["Vou à Fortaleza amanhã cedo.", "Falei à você sobre o prazo.", "Cheguei à casa de meus avós.", "Voltei à Fortaleza à noite."], "gabarito": 3, "explicacao": "\"Voltar da Fortaleza\" mostra que o nome aceita artigo (a Fortaleza), logo há crase em \"voltei à Fortaleza\". Em \"à noite\" há locução adverbial feminina. Já \"vou a Fortaleza\" não tem crase, \"a casa\" no sentido de lar não tem crase, e \"você\" é pronome.", "origem": {"aula": "Dia 10 - Aula 1", "tema": "crase"}}, {"id": "q025", "texto": null, "enunciado": "Assinale a alternativa em que a pontuação está de acordo com a norma-padrão:", "alternativas": ["O candidato, que estudou, foi aprovado.", "O candidato que estudou muito, foi aprovado.", "O candidato, que estudou muito foi aprovado.", "O candidato que, estudou muito foi aprovado."], "gabarito": 0, "explicacao": "A oração adjetiva explicativa fica entre vírgulas. Não se separa o sujeito do verbo com vírgula isolada.", "origem": {"aula": "Dia 10 - Aula 2", "tema": "pontuação"}}, {"id": "q026", "texto": null, "enunciado": "Assinale a alternativa em que o uso da vírgula está correto:", "alternativas": ["Maria, e João chegaram atrasados à prova.", "Joana, minha irmã, passou no concurso.", "Chegamos, ao local da prova, às oito horas.", "Os candidatos, aguardavam o início da prova."], "gabarito": 1, "explicacao": "\"Minha irmã\" é aposto e vem entre vírgulas. As demais erram: a vírgula antes de \"e\" separa termos coordenados, a segunda isola complemento verbal e a última separa sujeito e verbo.", "origem": {"aula": "Dia 10 - Aula 2", "tema": "pontuação"}}, {"id": "q027", "texto": null, "enunciado": "Em \"Choveu muito em Orós ontem\", o verbo \"chover\" é:", "alternativas": ["transitivo direto, com sujeito simples", "intransitivo, com sujeito indeterminado", "impessoal, e a oração não tem sujeito", "de ligação, com sujeito oculto"], "gabarito": 2, "explicacao": "Verbos que indicam fenômenos da natureza são impessoais: a oração tem sujeito inexistente, e o verbo fica na 3ª pessoa do singular.", "origem": {"aula": "Dia 10 - Aula 3", "tema": "sujeito e predicado"}}, {"id": "q028", "texto": null, "enunciado": "Em \"A professora entregou as provas aos alunos\", o termo \"aos alunos\" exerce função de:", "alternativas": ["objeto indireto", "objeto direto", "complemento nominal", "agente da passiva"], "gabarito": 0, "explicacao": "\"Entregar algo a alguém\": o termo regido pela preposição \"a\" completa o verbo e é objeto indireto. O objeto direto é \"as provas\".", "origem": {"aula": "Dia 10 - Aula 3", "tema": "termos essenciais e integrantes"}}, {"id": "q029", "texto": null, "enunciado": "Em \"Os candidatos chegaram cedo ao local de prova\", o termo \"cedo\" funciona como:", "alternativas": ["adjunto adnominal do substantivo local", "objeto direto do verbo chegar", "predicativo do sujeito candidatos", "adjunto adverbial de tempo"], "gabarito": 3, "explicacao": "\"Cedo\" modifica o verbo \"chegaram\" e indica o tempo da ação, sendo adjunto adverbial de tempo.", "origem": {"aula": "Dia 10 - Aula 4", "tema": "termos acessórios"}}, {"id": "q030", "texto": null, "enunciado": "Assinale a alternativa em que a oração está na voz passiva sintética:", "alternativas": ["O prefeito entregou as chaves.", "Alugam-se casas na praia.", "As casas foram alugadas ontem.", "Os moradores se cumprimentaram."], "gabarito": 1, "explicacao": "A passiva sintética se forma com verbo transitivo direto e o pronome \"se\", e o sujeito (casas) sofre a ação: \"alugam-se casas\". \"Foram alugadas\" é passiva analítica, \"entregou as chaves\" é voz ativa e \"se cumprimentaram\" é reflexiva (ou recíproca).", "origem": {"aula": "Dia 10 - Aula 4", "tema": "vozes verbais"}}, {"id": "q031", "texto": null, "enunciado": "Assinale a alternativa em que há metáfora, e não comparação:", "alternativas": ["Sua voz é suave como veludo.", "Ela corria como o vento da tarde.", "Parecia um anjo, de tão calmo.", "O tempo é um rio que não volta."], "gabarito": 3, "explicacao": "A metáfora identifica dois seres sem conectivo comparativo: \"o tempo é um rio\". Nas demais há \"como\" ou \"parecia\", que marcam comparação.", "origem": {"aula": "Dia 12 - Aula 1", "tema": "metáfora e comparação"}}, {"id": "q032", "texto": null, "enunciado": "Em \"Tomei dois copos no almoço\", ocorre metonímia, pois o termo \"copos\" designa:", "alternativas": ["o conteúdo, e não o recipiente", "o recipiente, e não o conteúdo que ele guarda", "uma parte do objeto, no lugar do todo", "um objeto de sentido oposto ao original"], "gabarito": 0, "explicacao": "Na metonímia, um termo é usado no lugar de outro com o qual mantém relação de proximidade. Aqui, o continente (copo) está no lugar do conteúdo (a bebida).", "origem": {"aula": "Dia 12 - Aula 1", "tema": "metonímia"}}, {"id": "q033", "texto": null, "enunciado": "Assinale a alternativa em que há catacrese:", "alternativas": ["O sol sorria sobre a praça cheia de gente.", "Seus olhos eram duas estrelas na noite escura.", "O pé da mesa quebrou durante a mudança.", "Chorei um oceano de saudade naquela tarde."], "gabarito": 2, "explicacao": "Catacrese é a metáfora desgastada pelo uso, quando não há outro nome disponível: \"pé da mesa\", \"braço da cadeira\". A é prosopopeia, B é metáfora e D é hipérbole.", "origem": {"aula": "Dia 12 - Aula 1", "tema": "catacrese"}}, {"id": "q034", "texto": null, "enunciado": "Em \"No sertão, a fartura e a escassez dividem o mesmo ano\", ocorre antítese porque:", "alternativas": ["há comparação introduzida por conectivo expresso", "há aproximação de ideias de sentido oposto", "há exagero intencional para dar ênfase", "há atribuição de ações humanas a seres inanimados"], "gabarito": 1, "explicacao": "Antítese é a aproximação de palavras ou ideias de sentido oposto: fartura e escassez. A descreve a comparação, C a hipérbole e D a prosopopeia.", "origem": {"aula": "Dia 12 - Aula 2", "tema": "antítese"}}, {"id": "q035", "texto": null, "enunciado": "Em \"Meu avô nos deixou na semana passada\", dito sobre alguém que morreu, ocorre:", "alternativas": ["eufemismo, que suaviza uma ideia desagradável", "ironia, que afirma o contrário do que se pensa", "hipérbole, que exagera uma ideia para enfatizá-la", "antítese, que opõe duas ideias na mesma frase"], "gabarito": 0, "explicacao": "O eufemismo substitui uma expressão dura (morrer) por outra mais suave (nos deixou). Não há exagero, oposição de ideias nem sentido contrário ao que se pensa.", "origem": {"aula": "Dia 12 - Aula 2", "tema": "eufemismo"}}, {"id": "q036", "texto": null, "enunciado": "Assinale a alternativa em que ocorre sinestesia:", "alternativas": ["O vento dançava nos milharais ao entardecer.", "O trovão fez bum, bum, bum no fim da tarde.", "Chorei rios de saudade quando ele partiu.", "Havia um cheiro doce e quente na cozinha."], "gabarito": 3, "explicacao": "Sinestesia mistura sensações de sentidos diferentes: cheiro (olfato), doce (paladar) e quente (tato). A é prosopopeia, B é onomatopeia e C é hipérbole.", "origem": {"aula": "Dia 12 - Aula 1", "tema": "sinestesia"}}, {"id": "q037", "texto": null, "enunciado": "Assinale a alternativa em que a concordância verbal está de acordo com a norma-padrão:", "alternativas": ["Faltou três candidatos à prova de ontem na sala.", "Existe muitos erros no relatório final entregue.", "Havia muitos candidatos esperando na fila.", "Fazem dois anos que ele se inscreveu."], "gabarito": 2, "explicacao": "\"Haver\" no sentido de existir é impessoal e fica no singular: \"havia\". Em A, o sujeito \"três candidatos\" pede \"faltaram\". Em B, \"existir\" concorda com \"erros\": existem. Em D, \"fazer\" indicando tempo é impessoal: \"faz dois anos\".", "origem": {"aula": "Dia 14 - Aula 1", "tema": "concordância verbal e verbos impessoais"}}, {"id": "q038", "texto": null, "enunciado": "Assinale a alternativa em que a concordância nominal está de acordo com a norma-padrão:", "alternativas": ["É proibido a entrada de menores no recinto.", "É proibida a entrada de menores no recinto.", "Seguem anexo as cópias solicitadas ontem.", "Ela mesmo preparou os documentos do edital."], "gabarito": 1, "explicacao": "Com o artigo (\"a entrada\"), o adjetivo concorda com o substantivo: proibida. Sem artigo, ficaria invariável (\"é proibido entrada\"). \"Anexo\" concorda com \"cópias\" (anexas) e \"mesmo\" com \"ela\" (mesma).", "origem": {"aula": "Dia 14 - Aula 1", "tema": "concordância nominal"}}, {"id": "q039", "texto": null, "enunciado": "Assinale a alternativa em que a concordância verbal está de acordo com a norma-padrão:", "alternativas": ["Aluga-se casas na praia durante a temporada.", "Precisam-se de motoristas para a prefeitura.", "Fazem três meses que não chove na região.", "Mais de um candidato recorreu da decisão."], "gabarito": 3, "explicacao": "\"Mais de um\" leva o verbo ao singular. Em A, o sujeito \"casas\" pede \"alugam-se\". Em B, \"precisar de\" é transitivo indireto, então \"precisa-se de\". Em C, \"fazer\" indicando tempo é impessoal: \"faz\".", "origem": {"aula": "Dia 14 - Aula 1", "tema": "concordância verbal"}}, {"id": "q040", "texto": null, "enunciado": "Assinale a alternativa correta quanto à concordância:", "alternativas": ["Ela está meio cansada, mas ficou bastante animada.", "Há menas pessoas na sala hoje do que havia ontem.", "Elas estavam bastantes cansadas depois da prova longa.", "Ele comprou meia quilo de queijo coalho no mercado."], "gabarito": 0, "explicacao": "Quando modificam um adjetivo, \"meio\" e \"bastante\" são advérbios e ficam invariáveis. \"Menas\" não existe, pois \"menos\" é invariável. \"Quilo\" é masculino, logo \"meio quilo\".", "origem": {"aula": "Dia 14 - Aula 1", "tema": "concordância nominal: meio, bastante, menos"}}, {"id": "q041", "texto": null, "enunciado": "Assinale a alternativa em que a regência verbal está de acordo com a norma-padrão:", "alternativas": ["Assistimos o jogo no estádio municipal.", "Assistimos ao jogo no estádio municipal.", "Prefiro mais o cinema do que o teatro.", "Obedeça os avisos da prefeitura, por favor."], "gabarito": 1, "explicacao": "No sentido de ver, \"assistir\" pede a preposição \"a\": assistimos ao jogo. \"Preferir\" dispensa \"mais\" e \"do que\" (prefiro o cinema ao teatro). \"Obedecer\" é transitivo indireto: obedeça aos avisos.", "origem": {"aula": "Dia 14 - Aula 2", "tema": "regência verbal"}}, {"id": "q042", "texto": null, "enunciado": "Em \"Prefiro estudar ___ ficar em casa\", a lacuna é corretamente preenchida por:", "alternativas": ["do que", "mais que", "a", "que a"], "gabarito": 2, "explicacao": "O verbo \"preferir\" pede a preposição \"a\" para introduzir o termo preterido: \"prefiro estudar a ficar em casa\". Evitam-se \"mais\" e \"do que\".", "origem": {"aula": "Dia 14 - Aula 2", "tema": "regência do verbo preferir"}}, {"id": "q043", "texto": null, "enunciado": "Assinale a alternativa em que o pronome relativo está empregado de acordo com a norma-padrão:", "alternativas": ["O filme a que assistimos foi muito premiado.", "O livro que preciso está sobre a mesa de estudo.", "A cidade que nasci fica no interior do Ceará.", "O amigo que confio mudou-se para a capital."], "gabarito": 0, "explicacao": "A preposição exigida pelo verbo vem antes do relativo. Quem assiste, assiste a algo: \"a que\". Nas demais faltam preposições: \"de que preciso\", \"em que (ou onde) nasci\", \"em quem confio\".", "origem": {"aula": "Dia 14 - Aula 2", "tema": "relativo e regência"}}, {"id": "q044", "texto": null, "enunciado": "Assinale a alternativa em que a regência nominal está de acordo com a norma-padrão:", "alternativas": ["Tenho aversão com mentiras de todo tipo.", "Ele é capaz em resolver o problema.", "Ela tem medo com escuro desde criança.", "Sinto orgulho dos meus alunos aprovados."], "gabarito": 3, "explicacao": "Os nomes pedem preposições específicas: orgulho DE/POR, capaz DE, medo DE, aversão A/POR. Só D respeita a regência.", "origem": {"aula": "Dia 14 - Aula 2", "tema": "regência nominal"}}, {"id": "q045", "texto": null, "enunciado": "Assinale a alternativa em que o emprego do acento grave indicativo de crase está correto:", "alternativas": ["Vou à pé para o trabalho todos os dias úteis.", "Fui à biblioteca pesquisar para o concurso.", "Entregue o documento à ele ainda hoje, por favor.", "Estamos dispostos à ajudar a comunidade."], "gabarito": 1, "explicacao": "Há crase na fusão da preposição \"a\" com o artigo \"a\": quem vai, vai a algum lugar, e \"biblioteca\" aceita artigo. Não há crase antes de palavra masculina (pé, ele) nem antes de verbo (ajudar).", "origem": {"aula": "Dia 14 - Aula 2", "tema": "regência e crase"}}, {"id": "q046", "texto": "valor-agua", "enunciado": "O texto sustenta, em sua ideia central, que:", "alternativas": ["o sertanejo economiza água por avareza e por costume antigo", "a memória da seca sustenta o uso consciente da água", "a fartura atual dispensa qualquer tipo de planejamento hídrico", "a cidade grande já domina a economia de água melhor que o sertão"], "gabarito": 1, "explicacao": "O texto afirma que a economia do sertanejo vem da memória (\"não se trata de avareza, mas de memória\") e que, na fartura, o risco é esquecer a lição. A contradiz \"não se trata de avareza\"; C contradiz o fecho (\"sem planejamento, nenhuma chuva basta\"); D inverte a comparação, pois a cidade grande \"ainda tenta aprender\".", "origem": {"aula": "Dia 1 - Aula 1", "tema": "compreensão e interpretação"}}, {"id": "q047", "texto": "valor-agua", "enunciado": "No segundo parágrafo, a palavra \"entretanto\" estabelece entre as ideias a relação de:", "alternativas": ["adição, pois acrescenta uma opinião semelhante à anterior", "causa, pois explica o que foi dito antes no texto", "conclusão, pois encerra o raciocínio do parágrafo anterior", "oposição, pois contrapõe duas posições"], "gabarito": 3, "explicacao": "\"Entretanto\" é conjunção adversativa: contrapõe quem acha que a fartura não deve alterar hábitos e quem teme o preço do desperdício.", "origem": {"aula": "Dia 1 - Aula 2", "tema": "coesão sequencial e conectivos"}}, {"id": "q048", "texto": "valor-agua", "enunciado": "No trecho \"o risco é esquecer a lição\", a expressão \"a lição\" retoma, por coesão:", "alternativas": ["o ensinamento deixado pela estiagem", "a obrigação de lavar a calçada todos os dias", "o nível do reservatório de água da cidade", "o planejamento hídrico da cidade grande"], "gabarito": 0, "explicacao": "No primeiro parágrafo, a estiagem \"ensinou\" algo ao sertanejo. \"A lição\" é a retomada desse ensinamento por substituição lexical, um recurso de coesão referencial.", "origem": {"aula": "Dia 1 - Aula 2", "tema": "coesão referencial"}}, {"id": "q049", "texto": "valor-agua", "enunciado": "No trecho \"outros, entretanto, acreditam\", as vírgulas isolam:", "alternativas": ["um aposto explicativo referente ao sujeito", "um vocativo dirigido ao leitor do texto", "uma conjunção adversativa deslocada", "uma oração subordinada adverbial de oposição"], "gabarito": 2, "explicacao": "Conjunções adversativas (entretanto, porém, contudo, todavia) deslocadas para o meio da oração são isoladas por vírgulas.", "origem": {"aula": "Dia 10 - Aula 2", "tema": "pontuação"}}, {"id": "q050", "texto": "valor-agua", "enunciado": "Em \"o desperdício de agora cobrará o preço da próxima seca\", a expressão \"cobrará o preço\" está empregada em sentido:", "alternativas": ["denotativo, pois se refere a um pagamento real", "técnico, pois pertence ao vocabulário da economia", "denotativo, pois descreve uma cobrança em dinheiro", "conotativo, pois indica consequências futuras"], "gabarito": 3, "explicacao": "Não se trata de cobrança em dinheiro: a expressão é figurada e indica que o desperdício trará consequências na próxima seca. É sentido conotativo.", "origem": {"aula": "Dia 2 - Aula 3", "tema": "denotação e conotação"}}, {"id": "q051", "texto": "comunicado-obras", "enunciado": "Em \"a quem caberá liberar a passagem\", o pronome \"quem\" retoma:", "alternativas": ["os moradores que precisarem de acesso", "o responsável pela obra", "os comerciantes do centro", "a Secretaria de Obras"], "gabarito": 1, "explicacao": "\"Quem\" retoma o antecedente mais próximo, \"o responsável pela obra\", e vem precedido de \"a\" porque \"caber\" pede a preposição \"a\" (caber a alguém). O relativo \"quem\" só se refere a pessoas e vem sempre com preposição.", "origem": {"aula": "Dia 6 - Aula 2", "tema": "pronomes relativos"}}, {"id": "q052", "texto": "comunicado-obras", "enunciado": "Em \"as ruas do centro serão interditadas\", a locução verbal indica voz:", "alternativas": ["passiva analítica, formada por ser e particípio", "passiva sintética, formada por verbo e pronome se", "reflexiva, em que o sujeito age sobre si mesmo", "ativa, em que o sujeito pratica a ação"], "gabarito": 0, "explicacao": "\"Serão interditadas\" é formada pelo auxiliar \"ser\" mais o particípio, e o sujeito (as ruas) sofre a ação: voz passiva analítica.", "origem": {"aula": "Dia 10 - Aula 4", "tema": "vozes verbais"}}, {"id": "q053", "texto": "comunicado-obras", "enunciado": "A locução \"a fim de que\", em \"a fim de que ninguém seja surpreendido\", pode ser substituída, sem alterar o sentido, por:", "alternativas": ["uma vez que", "embora", "para que", "conforme"], "gabarito": 2, "explicacao": "\"A fim de que\" é locução conjuntiva final, equivalente a \"para que\". \"Uma vez que\" é causal, \"embora\" é concessiva e \"conforme\" é conformativa.", "origem": {"aula": "Dia 8 - Aula 2", "tema": "reescrita: substituição de conectivos"}}, {"id": "q054", "texto": null, "enunciado": "Assinale a alternativa que apresenta uma característica do tipo textual dissertativo-argumentativo:", "alternativas": ["descrição detalhada de um ser, com predomínio de adjetivos", "defesa de um ponto de vista sustentada por argumentos", "sequência de ações no tempo, com personagens e enredo", "orientações sequenciadas, com verbos no imperativo"], "gabarito": 1, "explicacao": "O texto dissertativo-argumentativo defende um ponto de vista com argumentos. A descreve o tipo descritivo; C, o narrativo; D, o injuntivo.", "origem": {"aula": "Dia 2 - Aula 1", "tema": "tipologia textual"}}, {"id": "q055", "texto": null, "enunciado": "Assinale a alternativa em que todas as palavras estão grafadas corretamente:", "alternativas": ["privilégio, beneficiente, necessário", "exceção, previlégio, obsessão", "seção, excessão, paralisia", "paralisia, privilégio, beneficente"], "gabarito": 3, "explicacao": "Estão corretas: paralisia, privilégio e beneficente. Os erros são \"beneficiente\" (o certo é beneficente), \"previlégio\" (privilégio) e \"excessão\" (exceção).", "origem": {"aula": "Dia 5 - Aula 3", "tema": "ortografia"}}, {"id": "q056", "texto": null, "enunciado": "Assinale a alternativa em que todas as palavras são proparoxítonas:", "alternativas": ["lâmpada, café, médico, árvore", "árvore, órgão, médico, lâmpada", "lâmpada, árvore, médico", "lâmpada, saída, médico, árvore"], "gabarito": 2, "explicacao": "Proparoxítonas têm a antepenúltima sílaba tônica e são sempre acentuadas: lâm-pa-da, ár-vo-re, mé-di-co. \"Café\" é oxítona, \"órgão\" é paroxítona e \"saída\" (sa-í-da) é paroxítona com acento no hiato.", "origem": {"aula": "Dia 5 - Aula 4", "tema": "acentuação gráfica"}}, {"id": "q057", "texto": null, "enunciado": "Assinale a alternativa que traz, nesta ordem, uma palavra com encontro consonantal, outra com dígrafo e outra com hiato:", "alternativas": ["prato, chuva, saída", "chuva, prato, saída", "carro, prato, saída", "prato, saída, chuva"], "gabarito": 0, "explicacao": "\"Prato\" tem o encontro consonantal pr; \"chuva\" tem o dígrafo ch (duas letras, um fonema); \"saída\" tem hiato (sa-í-da). Nas demais, a ordem está trocada ou \"carro\" traz dígrafo (rr), e não encontro consonantal.", "origem": {"aula": "Dia 5 - Aula 2", "tema": "fonologia"}}, {"id": "q058", "texto": null, "enunciado": "Assinale a alternativa em que a palavra foi formada por parassíntese:", "alternativas": ["infelizmente", "desigualdade", "reaprender", "entristecer"], "gabarito": 3, "explicacao": "Na parassíntese, prefixo e sufixo são acrescentados ao mesmo tempo: en + triste + ecer (não existem \"entriste\" nem \"tristecer\"). \"Infelizmente\" e \"desigualdade\" resultam de derivações sucessivas, e \"reaprender\" é só prefixação.", "origem": {"aula": "Dia 8 - Aula 1", "tema": "formação de palavras"}}, {"id": "q059", "texto": null, "enunciado": "Assinale a alternativa em que a colocação do pronome átono está de acordo com a norma-padrão:", "alternativas": ["Me parece que o prazo terminou ontem.", "Ninguém disse-me nada sobre o horário.", "Quando o encontrei, ele já tinha saído.", "Todos esforçaram-se para ser aprovados no concurso."], "gabarito": 2, "explicacao": "A conjunção subordinativa \"quando\" atrai o pronome para antes do verbo. A começa a frase com oblíquo; em B, \"ninguém\" atrai a próclise (ninguém me disse); em D, \"todos\" atrai a próclise (todos se esforçaram).", "origem": {"aula": "Dia 6 - Aula 2", "tema": "colocação pronominal"}}, {"id": "q060", "texto": null, "enunciado": "Em \"Embora tivesse estudado, não passou\", o sentido é mantido, sem alteração da relação lógica, em:", "alternativas": ["Tinha estudado, portanto não passou.", "Tinha estudado, mas não passou.", "Tinha estudado, porque não passou.", "Tinha estudado, logo não passou."], "gabarito": 1, "explicacao": "\"Embora\" é concessiva (o estudo seria obstáculo à reprovação, mas não impediu), e \"mas\" é a adversativa equivalente. \"Portanto\" e \"logo\" indicam conclusão, e \"porque\", causa.", "origem": {"aula": "Dia 6 - Aula 3", "tema": "conjunções e relações lógicas"}}, {"id": "q061", "texto": null, "enunciado": "Assinale a alternativa em que o verbo \"vir\" está corretamente flexionado:", "alternativas": ["Eles vêm de ônibus todos os dias.", "Eles vem de ônibus todos os dias.", "Ele vêm de ônibus todos os dias.", "Eles veem de ônibus todos os dias."], "gabarito": 0, "explicacao": "Na 3ª pessoa do plural do presente, \"vir\" é \"vêm\" (com circunflexo); no singular, é \"vem\". \"Veem\" pertence ao verbo ver.", "origem": {"aula": "Dia 6 - Aula 3", "tema": "verbos"}}, {"id": "q062", "texto": null, "enunciado": "Assinale a alternativa em que o emprego do acento grave indicativo de crase está correto:", "alternativas": ["Refiro-me à ele em todos os documentos oficiais.", "Estamos dispostos à colaborar com a prefeitura de Orós.", "Dirigiu-se à secretaria para pedir informações.", "Chegamos à pé ao centro da cidade."], "gabarito": 2, "explicacao": "Há crase em \"à secretaria\": preposição \"a\" (exigida por \"dirigir-se\") mais artigo \"a\". Não há crase antes de pronome (ele), de verbo (colaborar) nem de palavra masculina (pé).", "origem": {"aula": "Dia 10 - Aula 1", "tema": "crase"}}, {"id": "q063", "texto": null, "enunciado": "Assinale a alternativa que apresenta paralelismo correto:", "alternativas": ["O candidato deve ler o edital, anotar as datas e que confira o local da prova.", "Prefiro o estudo diário a fazer provas sem nenhuma preparação anterior.", "Ele gosta de estudar e de que o ajudem na revisão final dos conteúdos.", "O candidato deve ler o edital, anotar as datas e conferir o local da prova."], "gabarito": 3, "explicacao": "O paralelismo exige estruturas de mesma natureza: em D, três infinitivos (ler, anotar, conferir). Em A, mistura-se infinitivo e oração subordinada; em B, substantivo e infinitivo; em C, infinitivo e oração subordinada.", "origem": {"aula": "Dia 8 - Aula 2", "tema": "reescrita: paralelismo"}}, {"id": "q064", "texto": null, "enunciado": "Assinale a alternativa em que o parônimo está empregado corretamente:", "alternativas": ["O prefeito ratificou o compromisso de campanha.", "A lei veda qualquer tipo de descriminação racial.", "A fumaça se dissipou, mas o perigo ainda era eminente.", "A mostra reuniu iminentes pintores da região norte."], "gabarito": 0, "explicacao": "\"Ratificar\" é confirmar (\"retificar\" é corrigir). Em B, o certo é \"discriminação\" (descriminar é inocentar). Em C, \"iminente\" (prestes a acontecer); \"eminente\" é notável. Em D, \"eminentes\" pintores.", "origem": {"aula": "Dia 2 - Aula 4", "tema": "parônimos"}}, {"id": "q065", "texto": null, "enunciado": "Em \"Os moradores entregaram os documentos ao fiscal\", os termos \"os documentos\" e \"ao fiscal\" exercem, respectivamente, a função de:", "alternativas": ["objeto indireto e objeto direto", "objeto direto e objeto indireto", "sujeito e objeto direto", "adjunto adnominal e complemento nominal"], "gabarito": 1, "explicacao": "\"Entregar algo a alguém\" é verbo transitivo direto e indireto: \"os documentos\" é o objeto direto (sem preposição) e \"ao fiscal\" é o objeto indireto (com a preposição a).", "origem": {"aula": "Dia 10 - Aula 3", "tema": "termos da oração"}}, {"id": "q066", "texto": null, "enunciado": "Em \"A cidade inteira correu ao açude, e as comportas, como bocas abertas, engoliam o rio\", os trechos \"a cidade inteira\" e \"como bocas abertas\" constituem, respectivamente:", "alternativas": ["metáfora e comparação", "catacrese e metonímia", "metonímia e comparação", "prosopopeia e hipérbole"], "gabarito": 2, "explicacao": "\"A cidade inteira\" é metonímia (o lugar pelos habitantes). \"Como bocas abertas\" é comparação, pois traz o conectivo \"como\".", "origem": {"aula": "Dia 12 - Aula 1", "tema": "figuras de linguagem"}}, {"id": "q067", "texto": null, "enunciado": "Assinale a alternativa em que a concordância verbal está de acordo com a norma-padrão:", "alternativas": ["Os Estados Unidos são um país extenso.", "Fazem dez anos que a ponte caiu e ninguém a consertou.", "Haviam muitos alunos na sala de aula do bloco B.", "Aluga-se casas na praia durante o verão inteiro."], "gabarito": 0, "explicacao": "Nome próprio no plural, precedido de artigo plural, pede verbo no plural: \"Os Estados Unidos são\". Em B, \"fazer\" de tempo é impessoal (\"faz\"); em C, \"haver\" existencial é impessoal (\"havia\"); em D, o sujeito é \"casas\" (\"alugam-se\").", "origem": {"aula": "Dia 14 - Aula 1", "tema": "concordância verbal"}}, {"id": "q068", "texto": null, "enunciado": "Em um requerimento dirigido à Prefeitura, é inadequado o emprego de:", "alternativas": ["pronome de tratamento, como \"Vossa Senhoria\"", "variedade formal da língua, com vocabulário preciso", "linguagem impessoal, sem marcas de opinião pessoal", "gírias e abreviações de mensagens de celular"], "gabarito": 3, "explicacao": "Documentos oficiais pedem a variedade formal, o pronome de tratamento adequado e a impessoalidade. Gírias e abreviações de mensagens informais são inadequadas ao gênero e ao interlocutor.", "origem": {"aula": "Dia 5 - Aula 1", "tema": "variedade linguística e adequação"}}, {"id": "q069", "texto": null, "enunciado": "Assinale a alternativa em que todos os plurais estão corretos:", "alternativas": ["cidadões, anzóis, guardas-civis", "anzóis, guarda-chuvas, cidadãos", "guardas-chuva, répteis, pães", "répteis, mãos, couves-flor"], "gabarito": 1, "explicacao": "Estão corretos: anzóis, guarda-chuvas (verbo + substantivo, só o segundo varia) e cidadãos. Erros: \"cidadões\" (A), \"guardas-chuva\" (C) e \"couves-flor\" (D, o correto é couves-flores).", "origem": {"aula": "Dia 6 - Aula 1", "tema": "plural dos substantivos"}}];
var TEXTOS={"agua-oros": {"titulo": "Texto de revisão: A água de Orós", "fonte": "Texto didático original.", "paragrafos": ["Em Orós, o açude é motivo de orgulho. Quando as comportas se abrem, famílias inteiras vão ver a água descer, e as crianças, que nunca esquecem a cena, contam o que viram aos mais novos. Mas há quem lembre os anos de seca: nesses tempos, o orgulho dava lugar à preocupação, e ninguém falava em festa.", "Hoje, com o reservatório cheio, a cidade respira aliviada, embora saiba que a água, como tudo que é precioso, merece cuidado."]}, "valor-agua": {"titulo": "Texto I: O valor da água", "fonte": "Texto didático original.", "paragrafos": ["A estiagem prolongada ensinou ao sertanejo uma economia que a cidade grande ainda tenta aprender. Antes de lavar a calçada, ele pensa no balde; antes de abrir a torneira, pensa na cisterna. Não se trata de avareza, mas de memória: quem já viu o açude secar sabe que a água, longe de ser infinita, é um bem que se divide.", "Hoje, com o reservatório de volta ao nível normal, o risco é esquecer a lição. Há quem diga que a fartura, por ser passageira, não deve alterar os hábitos; outros, entretanto, acreditam que o desperdício de agora cobrará o preço da próxima seca. Ambos concordam num ponto: sem planejamento, nenhuma chuva basta."]}, "comunicado-obras": {"titulo": "Texto II: Comunicado da Secretaria de Obras", "fonte": "Texto didático original.", "paragrafos": ["Senhores moradores,", "A Secretaria de Obras comunica que, a partir de segunda-feira, as ruas do centro serão interditadas para a instalação de novas tubulações. Os moradores que precisarem de acesso aos imóveis deverão procurar o responsável pela obra, a quem caberá liberar a passagem. Pede-se aos comerciantes que avisem seus clientes, a fim de que ninguém seja surpreendido. Agradecemos a compreensão de todos."]}};
var Q=[],R=null,i=0,score=0,wrong=[],done=false;
function $(id){return document.getElementById(id)}
function route(){
  var id=decodeURIComponent(location.hash.replace('#',''));
  R=RODADAS.filter(function(x){return x.id===id})[0];
  ['start','quiz','end'].forEach(function(k){$(k).className='hide'});
  if(!R){lista();return}
  var by={};QUESTOES.forEach(function(x){by[x.id]=x});Q=R.questoes.map(function(k){return by[k]});
  $('lista').className='hide';$('titulo').textContent=R.titulo;$('desc').textContent=R.descricao;document.title=R.titulo+' | Português para Orós';$('start').className='card';
}
function lista(){
  $('titulo').textContent='Portal de Revisões';$('desc').textContent='Português, concurso da Prefeitura de Orós (CE). Rodadas iniciais das aulas ao vivo.';document.title='Portal de Revisões | Português para Orós';
  var l=$('lista');l.className='';l.innerHTML='';
  RODADAS.slice().reverse().forEach(function(r){var a=document.createElement('a');a.className='card';a.href='#'+encodeURIComponent(r.id);
    var h=document.createElement('h2');h.textContent=r.titulo;var p=document.createElement('p');p.textContent=r.descricao+' ('+r.questoes.length+' questões)';a.appendChild(h);a.appendChild(p);l.appendChild(a)});
}
window.addEventListener('hashchange',route);route();
function begin(){i=0;score=0;wrong=[];$('start').className='hide';$('end').className='hide';$('quiz').className='';show()}
function show(){done=false;var q=Q[i];$('pos').textContent='Questão '+(i+1)+' de '+Q.length;$('sc').textContent='Acertos: '+score;
$('pb').style.width=(i/Q.length*100)+'%';$('qq').textContent=q.enunciado;$('fb').innerHTML='';$('next').className='btn hide';
var t=$('txt');t.innerHTML='';if(q.texto&&TEXTOS[q.texto]){var x=TEXTOS[q.texto];t.className='card txt';var h=document.createElement('h3');h.textContent=x.titulo;t.appendChild(h);
x.paragrafos.forEach(function(p){var e=document.createElement('p');e.textContent=p;t.appendChild(e)});var em=document.createElement('em');em.textContent=x.fonte;t.appendChild(em)}else{t.className='card txt hide'}
var o=$('opts');o.innerHTML='';q.alternativas.forEach(function(a,k){var b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+'ABCD'[k]+'</b><span></span>';b.lastChild.textContent=a;b.onclick=function(){pick(k)};o.appendChild(b)});window.scrollTo(0,0)}
function pick(k){if(done)return;done=true;var q=Q[i],bs=$('opts').children;for(var j=0;j<bs.length;j++){bs[j].disabled=true}
bs[q.gabarito].className='opt ok';var hit=k===q.gabarito;if(hit){score++}else{bs[k].className='opt no';wrong.push(q)}
var f=$('fb');f.className='fb '+(hit?'ok':'no');f.innerHTML='<strong>'+(hit?'Correto!':'Não foi dessa vez. Gabarito: '+'ABCD'[q.gabarito])+'</strong><span></span><div class="rev"></div>';
f.children[1].textContent=q.explicacao;f.children[2].textContent='Revisar: '+q.origem.aula+' ('+q.origem.tema+')';$('sc').textContent='Acertos: '+score;
$('next').textContent=i===Q.length-1?'Ver resultado':'Próxima';$('next').className='btn'}
function next(){if(i===Q.length-1){finish()}else{i++;show()}}
function finish(){$('quiz').className='hide';$('end').className='';var n=Q.length;$('fs').textContent=score+' / '+n;
var p=score/n;$('tier').textContent=p>=.85?'Ótimo! Siga com confiança para a aula.':p>=.6?'Bom! Revise os pontos errados indicados abaixo.':'Vale rever as aulas gravadas indicadas abaixo antes da próxima aula ao vivo.';
var r=$('rv');r.innerHTML='';if(!wrong.length){r.textContent='Você acertou tudo. Nada a rever!';return}
var g={};wrong.forEach(function(q){var k=q.origem.aula+' ('+q.origem.tema+')';(g[k]=g[k]||[]).push(q.id)});
var ul=document.createElement('ul');Object.keys(g).forEach(function(k){var li=document.createElement('li');li.textContent=k+': '+g[k].length+(g[k].length>1?' erros':' erro');ul.appendChild(li)});r.appendChild(ul)}
</script></body></html>
